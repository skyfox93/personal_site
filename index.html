<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skylar Salerno</title>
  <meta name="description" content="Skylar Salerno — software developer. Explore my resume and projects as a graph.">
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="graph.css">
</head>
<body>
  <canvas id="graph" aria-label="Interactive graph of Skylar's resume and projects"></canvas>

  <header class="hud">
    <div class="intro">
      <h1>Skylar Salerno</h1>
      <p>I develop software to make the world more connected</p>
    </div>
    <nav class="hub-nav" aria-label="Main sections">
      <button data-hub="resume" class="resume">Resume</button>
      <button data-hub="projects" class="projects">Projects</button>
    </nav>
  </header>

  <p class="hint">Click a node to focus · drag to move · scroll to zoom</p>

  <aside id="panel" aria-hidden="true">
    <button id="panel-close" aria-label="Close panel">×</button>
    <div id="panel-body"></div>
  </aside>

  <div id="video-modal" role="dialog" aria-label="Project video">
    <div class="frame"></div>
    <button class="close" aria-label="Close video">×</button>
  </div>

  <noscript>
    <p style="color:#ddd;padding:2rem">This site needs JavaScript for the graph. See the <a href="classic.html">classic version</a>.</p>
  </noscript>

  <script type="module" src="graph.js"></script>
</body>
</html>
